<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>EMI Calculator</title>
<style>
:root{--bg:#f3f7f2;--surface:#fff;--ink:#14231a;--muted:#5b6b60;--line:#d9e3da;--accent:#14532d;--accent2:#e0a526;--interest:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--surface:#162419;--ink:#e8f1ea;--muted:#9bb0a0;--line:#26382b;--accent:#4ade80;--accent2:#f0b73a;--interest:#fb923c}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Nirmala UI",Roboto,Arial,"Noto Sans",system-ui,sans-serif;line-height:1.45}
input,button{font-family:inherit}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px;font-weight:700}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.field{margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
label{font-size:.9rem;color:var(--muted)}
input[type=number],input[type=month]{width:140px;text-align:right;font-size:1rem;font-weight:600;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:.85rem;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;font-size:.85rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
details summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.92rem}
details[open] summary{margin-bottom:12px}
.emi{text-align:center;padding:20px 12px;background:var(--accent);color:var(--bg);border-radius:14px;margin-bottom:14px}
.emi small{opacity:.85;font-size:.85rem}
.emi strong{display:block;font-size:2.2rem;margin-top:2px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.donut{flex:none;width:96px;height:96px;border-radius:50%;position:relative}
.donut:after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--surface)}
.legend{font-size:.85rem;color:var(--muted)}
.legend div{margin:4px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--bg);border-radius:10px;padding:10px}
.stats span{display:block;font-size:.78rem;color:var(--muted)}
.stats b{font-size:1.02rem}
.save{background:var(--bg);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;margin-top:12px;font-size:.88rem}
button.ghost{width:100%;padding:11px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;margin-bottom:12px}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:360px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.big{font-size:1.4rem;font-weight:700;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>EMI Calculator</h1>

<div class="chips">
  <button class="chip" type="button" data-p="5000000" data-r="8.5" data-t="20">🏠 Home loan</button>
  <button class="chip" type="button" data-p="1000000" data-r="9" data-t="5">🚗 Car loan</button>
  <button class="chip" type="button" data-p="500000" data-r="12" data-t="3">💳 Personal</button>
  <button class="chip" type="button" data-p="1000000" data-r="9.5" data-t="7">🎓 Education</button>
</div>

<div class="card">
  <div class="field">
    <div class="row"><label for="pn">Loan amount (₹)</label><input id="pn" type="number" inputmode="numeric" min="0"></div>
    <input id="pr" type="range" min="10000" max="10000000" step="10000" aria-label="Loan amount">
  </div>
  <div class="field">
    <div class="row"><label for="rn">Interest rate (% per year)</label><input id="rn" type="number" inputmode="decimal" step="0.05" min="0"></div>
    <input id="rr" type="range" min="1" max="30" step="0.05" aria-label="Interest rate">
  </div>
  <div class="field">
    <div class="row">
      <label for="tn">Tenure</label>
      <div class="row" style="gap:8px;margin:0">
        <input id="tn" type="number" inputmode="numeric" min="1" style="width:80px">
        <div class="seg"><button id="uy" class="on" type="button">Years</button><button id="um" type="button">Months</button></div>
      </div>
    </div>
    <input id="tr" type="range" min="1" max="30" step="1" aria-label="Tenure">
  </div>
  <details>
    <summary>More options</summary>
    <div class="row"><label>Interest type</label><div class="seg"><button id="tr_" class="on" type="button">Reducing</button><button id="tf" type="button">Flat</button></div></div>
    <div class="row"><label for="fee">Processing fee (%)</label><input id="fee" type="number" inputmode="decimal" step="0.1" min="0" value="0"></div>
    <div class="row"><label for="sd">First EMI month</label><input id="sd" type="month"></div>
    <div id="pp">
      <div class="row"><label for="ex">Extra payment every month (₹)</label><input id="ex" type="number" inputmode="numeric" min="0" value="0"></div>
      <div class="row"><label for="lu">One-time prepayment (₹)</label><input id="lu" type="number" inputmode="numeric" min="0" value="0"></div>
      <div class="row"><label for="lm">Prepay in month no.</label><input id="lm" type="number" inputmode="numeric" min="1" value="12"></div>
    </div>
  </details>
</div>

<div class="emi"><small>Monthly EMI</small><strong id="emi">₹0</strong><small id="pay"></small></div>

<div class="card">
  <div class="top">
    <div class="donut" id="dn"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--accent)"></span>Principal <b id="lp"></b></div>
      <div><span class="dot" style="background:var(--interest)"></span>Interest <b id="li"></b></div>
    </div>
  </div>
  <div class="stats">
    <div><span>Principal</span><b id="sp">₹0</b></div>
    <div><span>Total interest</span><b id="si">₹0</b></div>
    <div><span>Total payment</span><b id="st">₹0</b></div>
    <div><span>Months</span><b id="sm">0</b></div>
    <div><span>Processing fee</span><b id="sf">₹0</b></div>
    <div><span>Total cost (with fee)</span><b id="sc">₹0</b></div>
  </div>
  <div class="save" id="sv" hidden></div>
</div>

<div class="card">
  <button class="ghost" id="tg" type="button">Show repayment schedule</button>
  <div id="tw" hidden>
    <div class="row"><label>View</label><div class="seg"><button id="vm" class="on" type="button">Monthly</button><button id="vy" type="button">Yearly</button></div></div>
    <div class="tablewrap">
      <table><thead><tr><th id="th">Month</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="tb"></tbody></table>
    </div>
  </div>
</div>

<div class="card">
  <h2>How much loan can I afford?</h2>
  <div class="row"><label for="ae">Monthly EMI I can pay (₹)</label><input id="ae" type="number" inputmode="numeric" min="0" value="25000"></div>
  <div class="legend">Loan you can take at the same rate and tenure</div>
  <div class="big" id="ar">₹0</div>
</div>

<button class="ghost" id="sh" type="button">Share result</button>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var inr=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
  var f=function(n){return '₹'+inr.format(Math.round(n))};
  var years=true,flat=false,view='m',rowsAll=[],summary='';
  var P=$('pn'),PR=$('pr'),R=$('rn'),RR=$('rr'),T=$('tn'),TR=$('tr');
  P.value=1000000;R.value=9;T.value=5;
  var d0=new Date();d0.setMonth(d0.getMonth()+1);
  $('sd').value=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0');

  function num(id){return parseFloat($(id).value)||0}
  function months(){return Math.round(years?num('tn')*12:num('tn'))}
  function dt(k){var s=($('sd').value||'').split('-');var y=+s[0]||d0.getFullYear(),m=(+s[1]||d0.getMonth()+1)-1;return new Date(y,m+k,1)}
  function lab(k){return dt(k).toLocaleDateString('en-IN',{month:'short',year:'numeric'})}

  function sim(p,rate,n,emi,ex,lu,lm){
    var r=rate/1200,rows=[],bal=p,ti=0,m,i,pr;
    if(flat){var I=p*rate/100*n/12;for(m=1;m<=n;m++)rows.push([m,p/n,I/n,Math.max(p-p/n*m,0)]);return{rows:rows,ti:I}}
    m=0;
    while(bal>0.5&&m<1200){m++;i=bal*r;pr=Math.min(emi+ex+(m===lm?lu:0)-i,bal);if(pr<=0)break;bal-=pr;ti+=i;rows.push([m,pr,i,Math.max(bal,0)])}
    return{rows:rows,ti:ti};
  }

  function calc(){
    var p=num('pn'),rate=num('rn'),n=months(),r=rate/1200,emi=0,ok=p>0&&n>0;
    if(ok)emi=flat?(p+p*rate/100*n/12)/n:(r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
    var tot=emi*n,ti=Math.max(tot-p,0),fee=p*num('fee')/100;
    var ex=flat?0:num('ex'),lu=flat?0:num('lu'),lm=Math.round(num('lm'))||1;
    var base=ok?sim(p,rate,n,emi,0,0,0):{rows:[],ti:0};
    var used=ok&&(ex>0||lu>0);
    var pre=used?sim(p,rate,n,emi,ex,lu,lm):base;
    rowsAll=pre.rows;
    $('emi').textContent=f(emi);
    $('pay').textContent=rowsAll.length?'Loan ends '+lab(rowsAll.length-1):'';
    $('sp').textContent=f(p);$('si').textContent=f(ti);$('st').textContent=f(tot);$('sm').textContent=n;
    $('sf').textContent=f(fee);$('sc').textContent=f(tot+fee);
    var pp=tot>0?p/tot*100:0;
    $('dn').style.background=tot>0?'conic-gradient(var(--accent) 0 '+pp+'%,var(--interest) 0)':'var(--line)';
    $('lp').textContent=pp.toFixed(0)+'%';$('li').textContent=(tot>0?100-pp:0).toFixed(0)+'%';
    var sv=$('sv');
    if(used){
      var mo=base.rows.length-pre.rows.length;
      sv.hidden=false;
      sv.textContent='With prepayment you save '+f(base.ti-pre.ti)+' interest and finish '+mo+' month'+(mo===1?'':'s')+' earlier ('+lab(pre.rows.length-1)+').';
    }else sv.hidden=true;
    var e=num('ae');
    $('ar').textContent=f(flat?e*n/(1+rate/100*n/12):(r===0?e*n:e*(1-Math.pow(1+r,-n))/r));
    summary='EMI Calculator\nLoan '+f(p)+' at '+rate+'% for '+n+' months\nMonthly EMI: '+f(emi)+'\nTotal interest: '+f(ti)+'\nTotal payment: '+f(tot)+'\n'+location.href;
    if(!$('tw').hidden)render();
  }

  function tr(a,b,c,d){return '<tr><td>'+a+'</td><td>'+inr.format(Math.round(b))+'</td><td>'+inr.format(Math.round(c))+'</td><td>'+inr.format(Math.round(d))+'</td></tr>'}
  function render(){
    var h='';
    if(view==='m'){rowsAll.forEach(function(x){h+=tr(lab(x[0]-1),x[1],x[2],x[3])})}
    else{
      var g={},ord=[];
      rowsAll.forEach(function(x){var y=dt(x[0]-1).getFullYear();if(!g[y]){g[y]=[0,0,0];ord.push(y)}g[y][0]+=x[1];g[y][1]+=x[2];g[y][2]=x[3]});
      ord.forEach(function(y){h+=tr(y,g[y][0],g[y][1],g[y][2])});
    }
    $('tb').innerHTML=h;$('th').textContent=view==='m'?'Month':'Year';
  }

  function syncRanges(){PR.value=P.value;RR.value=R.value;TR.max=years?30:360;TR.value=T.value}
  function pick(a,b,first){$(a).classList.toggle('on',first);$(b).classList.toggle('on',!first)}

  PR.oninput=function(){P.value=PR.value;calc()};
  RR.oninput=function(){R.value=RR.value;calc()};
  TR.oninput=function(){T.value=TR.value;calc()};
  [P,R,T].forEach(function(e){e.oninput=function(){syncRanges();calc()}});
  ['fee','sd','ex','lu','lm','ae'].forEach(function(id){$(id).oninput=calc;$(id).onchange=calc});

  function setUnit(y){
    if(y===years)return;
    var m=months();years=y;
    T.value=y?Math.max(1,Math.round(m/12)):m;
    pick('uy','um',y);syncRanges();calc();
  }
  $('uy').onclick=function(){setUnit(true)};
  $('um').onclick=function(){setUnit(false)};
  $('tr_').onclick=function(){flat=false;pick('tr_','tf',true);$('pp').hidden=false;calc()};
  $('tf').onclick=function(){flat=true;pick('tr_','tf',false);$('pp').hidden=true;calc()};
  $('vm').onclick=function(){view='m';pick('vm','vy',true);render()};
  $('vy').onclick=function(){view='y';pick('vm','vy',false);render()};
  $('tg').onclick=function(){
    var tw=$('tw');tw.hidden=!tw.hidden;
    $('tg').textContent=tw.hidden?'Show repayment schedule':'Hide schedule';
    if(!tw.hidden)render();
  };
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
    c.onclick=function(){
      P.value=c.dataset.p;R.value=c.dataset.r;T.value=c.dataset.t;years=true;
      pick('uy','um',true);syncRanges();calc();
    };
  });
  $('sh').onclick=function(){
    var b=$('sh');
    if(navigator.share){navigator.share({text:summary}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(summary).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Share result'},1500)})}
  };
  syncRanges();calc();
})();
</script>
</body>
</html>
